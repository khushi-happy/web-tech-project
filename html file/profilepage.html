<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Settings Dashboard</title>

    <link rel="stylesheet" href="profilepage.css">
    <link rel="stylesheet" href="fixed.css">
</head>
<body>

<div class="container">

    <aside class="sidebar">

        <div class="profile">
            <div class="avatar" id="avatar">DU</div>

            <div class="profile-info">
                <h4 id="profileName">Demo User</h4>
                <p id="profileEmail">demo@webtech.practice</p>
            </div>
        </div>

        <div class="menu-title">DASHBOARD</div>

        <ul class="menu">
            <li><a href="overviewpage.html" id="overview">Overview</a></li>
            <li class="active"><a href="profilepage.html" id="profile">Profile Settings</a></li>
            <li><a href="securitypage.html" id="security">Security</a></li>
            <li><a href="notificationpage.html" id="notification">Notification</a></li>
        </ul>

        <div class="menu-title">QUICK ACTION</div>

        <ul class="menu">
            <li><a href="helppage.html" id="help">Help & Support</a></li>
        </ul>

        <div class="bottom-menu">
            <div class="menu-title">ACCOUNT</div>

            <ul class="menu">
                <li><a href="#" id="logout">Sign Out</a></li>
            </ul>
        </div>

    </aside>

    <main class="main">

        <header class="topbar">
            <h3>WebTech Practice Dashboard</h3>
        </header>

        <section class="card">

            <h2>Profile Settings</h2>

            <h4>Personal Information</h4>

            <form id="profileForm">

                <div class="grid">

                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="fullName">
                    </div>

                    <div class="form-group">
                        <label>Date of Birth</label>
                        <input type="date" id="dob">
                    </div>

                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="email">
                    </div>

                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="text" id="phone">
                    </div>

                </div>

                <h4 class="section-title">Address Information</h4>

                <div class="form-group full">
                    <label>Street Address</label>
                    <textarea rows="4" id="address"></textarea>
                </div>

                <div class="grid">

                    <div class="form-group">
                        <label>PIN Code</label>
                        <input type="text" id="pincode">
                    </div>

                    <div class="form-group">
                        <label>City</label>
                        <input type="text" id="city">
                    </div>

                    <div class="form-group">
                        <label>Country</label>
                        <input type="text" id="country">
                    </div>

                    <div class="form-group">
                        <label>GitHub Profile</label>
                        <input type="text" id="github">
                    </div>

                </div>

                <div class="buttons">
                    <button class="cancel" type="button">Cancel Changes</button>
                    <button class="save" type="submit" id="saveProfile">Save Changes</button>
                </div>

            </form>

        </section>

    </main>

</div>
<script>
    document.getElementById("saveProfile").addEventListener("click", function () {

    let currentUser = JSON.parse(localStorage.getItem("currentUser"));

    if (!currentUser) {
        alert("No user logged in");
        return;
    }


    // Get values from inputs
    currentUser.phone = document.getElementById("phone").value;
    currentUser.address = document.getElementById("address").value;
    currentUser.city = document.getElementById("city").value;
    currentUser.pincode = document.getElementById("pincode").value;
    currentUser.country = document.getElementById("country").value;
    currentUser.github = document.getElementById("github").value;


    // Save updated current user
    localStorage.setItem(
        "currentUser",
        JSON.stringify(currentUser)
    );


    // Update users list also
    let users = JSON.parse(localStorage.getItem("users")) || [];


    users = users.map(function(user){

        if(user.email === currentUser.email){

            user.phone = currentUser.phone;
            user.address = currentUser.address;
            user.city = currentUser.city;
            user.pincode = currentUser.pincode;
            user.country = currentUser.country;
            user.github = currentUser.github;


        }

        return user;

    });


    localStorage.setItem(
        "users",
        JSON.stringify(users)
    );


    alert("Profile information saved successfully!");

});
window.onload = function(){

    let currentUser = JSON.parse(localStorage.getItem("currentUser"));

    if(currentUser){

        document.getElementById("phone").value = currentUser.phone || "";
        document.getElementById("address").value = currentUser.address || "";
        document.getElementById("city").value = currentUser.city || "";
        document.getElementById("pincode").value = currentUser.pincode || "";
        document.getElementById("country").value = currentUser.country || "";
        document.getElementById("github").value = currentUser.github || "";


    }

};
</script>
<script src="common.js"></script>

</body>
</html>
